<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tesseract</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 4;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Tesseract (hipercubo simulado con dos cubos)
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshBasicMaterial({
    color: 0x00aaff,
    wireframe: true
  });

  const cubeOuter = new THREE.Mesh(geometry, material);
  const cubeInner = new THREE.Mesh(
    geometry.clone(),
    material.clone()
  );
  cubeInner.scale.set(0.6, 0.6, 0.6);

  scene.add(cubeOuter);
  scene.add(cubeInner);

  function animate() {
    requestAnimationFrame(animate);

    cubeOuter.rotation.x += 0.003;
    cubeOuter.rotation.y += 0.004;

    cubeInner.rotation.x -= 0.004;
    cubeInner.rotation.y -= 0.003;

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
