<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tesseract</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Georgia, "Times New Roman", serif;
    }

    canvas {
      display: block;
    }

    /* Mensaje inicial Teseracto activado */
    #mensaje-teseracto {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50px;
      font-weight: bold;
      color: red;
      opacity: 1;
      transition: opacity 3s ease-out;
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Mensajes aleatorios */
    .mensaje-aleatorio {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      transition: all 1s ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Mensaje inicial -->
  <div id="mensaje-teseracto">Teseracto activado</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
  // ===== TESSERACT =====
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 4;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Cubos
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const materialOuter = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true });
  const materialInner = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true });

  const cubeOuter = new THREE.Mesh(geometry, materialOuter);
  const cubeInner = new THREE.Mesh(geometry.clone(), materialInner);
  cubeInner.scale.set(0.6, 0.6, 0.6);

  scene.add(cubeOuter);
  scene.add(cubeInner);

  // Variables animación cubo (solo tamaño)
  let grow = true;
  let scale = 1;

  function animate() {
    requestAnimationFrame(animate);

    // Rotación
    cubeOuter.rotation.x += 0.003;
    cubeOuter.rotation.y += 0.004;
    cubeInner.rotation.x -= 0.004;
    cubeInner.rotation.y -= 0.003;

    // Oscilación tamaño
    if (grow) scale += 0.003;
    else scale -= 0.003;
    if (scale > 1.2) grow = false;
    if (scale < 0.8) grow = true;
    cubeOuter.scale.set(scale, scale, scale);
    cubeInner.scale.set(scale * 0.6, scale * 0.6, scale * 0.6);

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ===== MENSAJE INICIAL =====
  const mensaje = document.getElementById("mensaje-teseracto");
  setTimeout(() => { mensaje.style.opacity = 0; }, 3000);

  // ===== MENSAJES ALEATORIOS =====
  const mensajes = [
    "El tiempo se distorsiona...",
    "¿Ves más allá?",
    "Dimensiones colapsando",
    "Código secreto activado",
    "No mires directamente..."
  ];

  function mostrarMensajeAleatorio() {
    const msgDiv = document.createElement("div");
    msgDiv.className = "mensaje-aleatorio";
    msgDiv.textContent = mensajes[Math.floor(Math.random() * mensajes.length)];

    // posición aleatoria
    const x = Math.random() * (window.innerWidth - 200);
    const y = Math.random() * (window.innerHeight - 50);
    msgDiv.style.left = x + "px";
    msgDiv.style.top = y + "px";

    // tamaño y color inicial
    let fontSize = 20 + Math.random() * 10; // 20-30px
    msgDiv.style.fontSize = fontSize + "px";
    let color = ["#00ffff", "#ff00ff", "#ffff00", "#00ff00"][Math.floor(Math.random() * 4)];
    msgDiv.style.color = color;

    document.body.appendChild(msgDiv);

    // animación de aparición
    requestAnimationFrame(() => { msgDiv.style.opacity = 1; });

    // animación de crecimiento/encogimiento
    let growText = true;
    const animText = setInterval(() => {
      fontSize += growText ? 0.5 : -0.5;
      if(fontSize > 35) growText = false;
      if(fontSize < 20) growText = true;
      msgDiv.style.fontSize = fontSize + "px";
      // cambio de color aleatorio
      color = ["#00ffff", "#ff00ff", "#ffff00", "#00ff00"][Math.floor(Math.random() * 4)];
      msgDiv.style.color = color;
    }, 100);

    // desaparecer después de 5 segundos
    setTimeout(() => {
      clearInterval(animText);
      msgDiv.style.opacity = 0;
      setTimeout(() => msgDiv.remove(), 1000);
    }, 5000);
  }

  // Mostrar un mensaje aleatorio cada 5 segundos
  setInterval(mostrarMensajeAleatorio, 5000);

</script>
</body>
</html>
