<!DOCTYPE html>

<!--
==============================================================================
    DISTRITO ZERO
    ERROR CODE 198

    Página oculta de la web oficial.

    Esta página representa un archivo clasificado recuperado del universo de
    Distrito Zero. Su comportamiento está controlado mediante JavaScript y
    Three.js.

    Autor: Gonzalo Fierro
==============================================================================
-->

<html lang="es">

<head>

    <!-- ==========================================================
         CONFIGURACIÓN GENERAL
    =========================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error Code 198 | Distrito Zero</title>

    <meta name="description"
          content="Archivo clasificado perteneciente al universo de Distrito Zero.">

    <meta name="theme-color" content="#000000">

    <!-- ==========================================================
         HOJA DE ESTILOS
    =========================================================== -->

    <link rel="stylesheet" href="Teseracto.css">

</head>

<body>

    <!-- ==========================================================
         MENSAJE CENTRAL

         Este texto cambia automáticamente durante la secuencia de
         recuperación del archivo.
    =========================================================== -->

    <div id="mensaje-teseracto">

        RECUPERANDO ARCHIVO...

    </div>


    <!-- ==========================================================
         CONTENEDOR PARA EFECTOS FUTUROS

         Actualmente no contiene elementos, pero permitirá añadir
         partículas, destellos, símbolos o cualquier otro efecto
         visual sin modificar el resto del documento.
    =========================================================== -->

    <div id="overlay"></div>


    <!-- ==========================================================
         THREE.JS

         Biblioteca utilizada para renderizar el teseracto.
    =========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>


    <!-- ==========================================================
         LÓGICA PRINCIPAL

         Todo el comportamiento del archivo se encuentra en
         Teseracto.js.
    =========================================================== -->

    <script src="Teseracto.js"></script>

</body>

</html>
